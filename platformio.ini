; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_ldf_mode = deep+
build_src_filter =
	+<main.cpp>
	+<LibRobus.cpp>
	+<Mouvement.cpp>
	+<DetercteurProximite.cpp>
	+<Son.cpp>
	+<../lib/**/*.cpp>
	-<mainOGled.cpp>
build_flags =
	-I lib
	-I $PROJECT_PACKAGES_DIR/framework-arduino-avr/libraries/SPI/src
	-I $PROJECT_PACKAGES_DIR/framework-arduino-avr/libraries/Wire/src
	-I $PROJECT_PACKAGES_DIR/framework-arduino-avr/libraries/SoftwareSerial/src
